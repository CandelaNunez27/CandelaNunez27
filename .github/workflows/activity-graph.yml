name: Generate Activity Graph

on:
  schedule:
    - cron: "0 0 * * *" # Se ejecuta automáticamente todos los días a la medianoche
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  build:
    runs-on: ubuntu-latest
    name: Update Activity Graph SVG

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate SVG
        uses: maurodesouza/github-readme-activity-graph-action@v2
        with:
          # Genera el gráfico utilizando tus datos públicos
          USERNAME: ${{ github.repository_owner }}
          # Configura el tema visual (puedes cambiarlo si lo deseas)
          THEME: tokyo-night

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Automated Activity Graph Update" || exit 0
          git push
